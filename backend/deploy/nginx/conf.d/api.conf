# HTTP: answers Let's Encrypt challenges, and serves the API until HTTPS is set up.
# Once you have a certificate (see DEPLOY.md), enable ../https.conf.example and
# replace the `location /` block below with the redirect.
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # After enabling HTTPS, replace this block with:
        #   return 301 https://$host$request_uri;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
