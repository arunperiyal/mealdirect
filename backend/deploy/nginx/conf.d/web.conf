# The web apps. Their ports are only published with docker-compose.web.yml, which also mounts
# the builds at /srv/web. Single-page apps, so unknown paths get index.html.
# Expo's bundles have content hashes in their names and can be cached for good.
map $uri $web_cache {
    ~^/_expo/  "public, max-age=31536000, immutable";
    default    "no-cache";
}

server {
    listen 8101;
    root /srv/web/customer;
    location / { try_files $uri /index.html; add_header Cache-Control $web_cache; }
}

server {
    listen 8102;
    root /srv/web/restaurant;
    location / { try_files $uri /index.html; add_header Cache-Control $web_cache; }
}

server {
    listen 8103;
    root /srv/web/delivery;
    location / { try_files $uri /index.html; add_header Cache-Control $web_cache; }
}

server {
    listen 8104;
    root /srv/web/admin;
    location / { try_files $uri /index.html; add_header Cache-Control $web_cache; }
}
