# HTTP: answers Let's Encrypt challenges, and serves the API (/api/), the website (/)
# and the Android downloads (/download/) until HTTPS is set up. Once you have a
# certificate (see DEPLOY.md), enable ../https.conf.example and replace the three
# blocks below with the redirect.
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # After enabling HTTPS, replace the blocks below with:
    #   location / { return 301 https://$host$request_uri; }
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The website and the Android apps to install, from web/site/ and web/downloads/
    # (mounted by docker-compose.web.yml; without it these paths are 404s)
    location /download/ {
        alias /srv/web/downloads/;
        index index.html;
        types { text/html html; image/png png; application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
    }

    location / {
        root /srv/web/site;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
