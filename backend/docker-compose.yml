# Local development services. Run the API itself with `npm run dev`.
# Production lives in deploy/docker-compose.prod.yml.
services:
  postgres:
    image: postgres:15-alpine
    container_name: mess_postgres
    environment:
      POSTGRES_USER: mess_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: mess_app
    # Not exposed to the network. docker-compose.override.yml (local, not
    # committed) can publish it on 127.0.0.1 for `npm run dev`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mess_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mess_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: mess_network
